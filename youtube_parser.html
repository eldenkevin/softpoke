<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>유튜브 인플루언서 데이터 파서</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(135deg, #ff0000 0%, #cc0000 100%);
            min-height: 100vh;
        }
        .container {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 2.5em;
        }
        .youtube-icon {
            color: #ff0000;
        }
        .input-section {
            margin-bottom: 30px;
        }
        textarea {
            width: 100%;
            height: 400px;
            border: 2px solid #ddd;
            border-radius: 10px;
            padding: 15px;
            font-size: 14px;
            font-family: monospace;
            resize: vertical;
            transition: border-color 0.3s;
        }
        textarea:focus {
            border-color: #ff0000;
            outline: none;
        }
        .button-group {
            text-align: center;
            margin: 30px 0;
        }
        button {
            background: linear-gradient(135deg, #ff0000 0%, #cc0000 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            margin: 0 10px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        .results-section {
            margin-top: 30px;
        }
        .stats {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
        }
        .stats h3 {
            margin-top: 0;
            color: #333;
        }
        .preview-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            font-size: 12px;
        }
        .preview-table th,
        .preview-table td {
            border: 1px solid #ddd;
            padding: 6px;
            text-align: left;
        }
        .preview-table th {
            background-color: #f2f2f2;
            font-weight: bold;
            font-size: 11px;
        }
        .preview-table tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        .status {
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
        }
        .status.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .status.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .loading {
            text-align: center;
            padding: 20px;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #ff0000;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .recent-views {
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            border-radius: 5px;
            padding: 8px;
            margin: 5px 0;
            font-size: 11px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1><span class="youtube-icon">📺</span> 유튜브 인플루언서 데이터 파서</h1>
        
        <div class="input-section">
            <h3>📋 NOX 유튜브 인플루언서 데이터를 아래에 붙여넣으세요:</h3>
            <textarea 
                id="rawData" 
                placeholder="여기에 NOX에서 복사한 유튜브 인플루언서 데이터를 붙여넣으세요..."></textarea>
        </div>

        <div class="button-group">
            <button onclick="parseData()" id="parseBtn">🚀 데이터 파싱하기</button>
            <button onclick="downloadExcel()" id="downloadBtn" disabled>📊 엑셀 다운로드</button>
            <button onclick="clearData()">🗑️ 초기화</button>
        </div>

        <div id="loading" class="loading" style="display: none;">
            <div class="spinner"></div>
            <p>데이터를 파싱하는 중입니다...</p>
        </div>

        <div id="results" class="results-section"></div>
    </div>

    <script>
        let parsedData = [];

        function parseYouTubeData(rawText) {
            const blocks = rawText.split(/\n(?=\d+\.\d+\n)/);
            const youtubers = [];
            
            blocks.forEach(block => {
                if (block.trim().length < 50) return;
                
                const lines = block.split('\n').map(line => line.trim()).filter(line => line);
                if (lines.length < 5) return;
                
                const youtuber = {
                    '순번': youtubers.length + 1,
                    '점수': '',
                    '채널명': '',
                    '핸들': '',
                    '태그': '',
                    '구독자수': '',
                    '총조회수': '',
                    '동영상수': '',
                    '국적': '',
                    '협업잠재력': '',
                    '조회수구독자비율': '',
                    '인게이지먼트비율': '',
                    '예상조회수': '',
                    '최근조회수_데이터': []
                };
                
                let foundNumbers = false;
                let foundFirstPercent = false;
                let collectingViewsData = false;
                
                lines.forEach((line, i) => {
                    // 점수 (첫 번째 라인, 숫자.숫자 형태)
                    if (i === 0 && /^\d+\.\d+$/.test(line)) {
                        youtuber['점수'] = line;
                    }
                    // 채널명 (점수 바로 다음, @ 시작 아님)
                    else if (i === 1 && !line.startsWith('@')) {
                        youtuber['채널명'] = line;
                    }
                    // 핸들 (@ 시작)
                    else if (line.startsWith('@')) {
                        youtuber['핸들'] = line;
                    }
                    // 태그 (핸들 바로 다음, 영문 소문자)
                    else if (i > 0 && lines[i-1].startsWith('@') && /^[a-z]+/.test(line)) {
                        youtuber['태그'] = line;
                    }
                    // 구독자/총조회수/동영상수 (K, M 포함 3개 숫자)
                    else if (!foundNumbers) {
                        const numberMatch = line.match(/^\s*(\d+\.?\d*[KM]?)\s+(\d+\.?\d*[KM]?)\s+(\d+\.?\d*[KM]?)\s*$/);
                        if (numberMatch) {
                            youtuber['구독자수'] = numberMatch[1];
                            youtuber['총조회수'] = numberMatch[2];
                            youtuber['동영상수'] = numberMatch[3];
                            foundNumbers = true;
                        }
                    }
                    // 국적
                    else if (['Taiwan', 'South Korea', 'Hong Kong SAR China', 'Macau SAR China', 'United States', 'Japan', 'China'].includes(line)) {
                        youtuber['국적'] = line.replace(' SAR China', '');
                    }
                    // 협업잠재력 (숫자/10 형태)
                    else if (line.includes('/10')) {
                        const coopMatch = line.match(/(\d+)\s*\/\s*10/);
                        if (coopMatch) {
                            youtuber['협업잠재력'] = `${coopMatch[1]}/10`;
                        }
                    }
                    // Views/Subs 비율
                    else if (line.includes('Views/Subs')) {
                        collectingViewsData = false; // Views/Subs가 나오면 조회수 데이터 수집 중단
                    }
                    // 퍼센트 값들
                    else if (line.includes('%')) {
                        if (!foundFirstPercent) {
                            youtuber['조회수구독자비율'] = line;
                            foundFirstPercent = true;
                        } else if (!youtuber['인게이지먼트비율']) {
                            youtuber['인게이지먼트비율'] = line;
                        }
                    }
                    // 예상조회수 (K, M 포함하고 앞 라인에 Views 있음)
                    else if ((line.includes('K') || line.includes('M')) && 
                            i > 0 && lines[i-1].includes('Views')) {
                        youtuber['예상조회수'] = line;
                        collectingViewsData = true; // 예상조회수 이후부터 최근 조회수 데이터 수집 시작
                    }
                    // 날짜별 조회수 데이터 (YYYY-MM-DD 형태가 있는 라인의 앞 라인)
                    else if (/\d{4}-\d{2}-\d{2}/.test(line)) {
                        if (i > 0 && /^\d+\.?\d*[KM]?$/.test(lines[i-1])) {
                            youtuber['최근조회수_데이터'].push({
                                조회수: lines[i-1],
                                날짜: line
                            });
                        }
                    }
                    // 단독으로 나오는 조회수 데이터 (예상조회수 이후)
                    else if (collectingViewsData && /^\d+\.?\d*[KM]?$/.test(line) && 
                            !youtuber['예상조회수'].includes(line)) {
                        // 다음 라인에 날짜가 있는지 확인
                        if (i + 1 < lines.length && /\d{4}-\d{2}-\d{2}/.test(lines[i + 1])) {
                            // 날짜가 있으면 다음 루프에서 처리됨
                        } else {
                            // 날짜가 없으면 그냥 조회수만 저장
                            youtuber['최근조회수_데이터'].push({
                                조회수: line,
                                날짜: ''
                            });
                        }
                    }
                });
                
                // 최소 조건: 채널명이나 핸들이 있어야 함
                if (youtuber['채널명'] || youtuber['핸들']) {
                    youtubers.push(youtuber);
                }
            });
            
            return youtubers;
        }

        function convertToNumber(value) {
            if (!value) return 0;
            value = String(value).replace(',', '');
            if (value.includes('K')) {
                return parseFloat(value.replace('K', '')) * 1000;
            } else if (value.includes('M')) {
                return parseFloat(value.replace('M', '')) * 1000000;
            } else {
                try {
                    return parseFloat(value);
                } catch {
                    return 0;
                }
            }
        }

        function parseData() {
            const rawData = document.getElementById('rawData').value.trim();
            if (!rawData) {
                alert('데이터를 입력해주세요!');
                return;
            }

            document.getElementById('loading').style.display = 'block';
            document.getElementById('results').innerHTML = '';
            document.getElementById('parseBtn').disabled = true;

            setTimeout(() => {
                try {
                    parsedData = parseYouTubeData(rawData);
                    
                    // 구독자 수 기준으로 정렬
                    parsedData.sort((a, b) => convertToNumber(b['구독자수']) - convertToNumber(a['구독자수']));
                    
                    // 순번 재정렬
                    parsedData.forEach((item, index) => {
                        item['순번'] = index + 1;
                    });

                    displayResults();
                    document.getElementById('downloadBtn').disabled = false;
                    
                    document.getElementById('results').innerHTML += 
                        `<div class="status success">✅ ${parsedData.length}명의 유튜브 인플루언서 데이터가 성공적으로 파싱되었습니다!</div>`;
                        
                } catch (error) {
                    document.getElementById('results').innerHTML = 
                        `<div class="status error">❌ 파싱 중 오류가 발생했습니다: ${error.message}</div>`;
                } finally {
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('parseBtn').disabled = false;
                }
            }, 500);
        }

        function displayResults() {
            if (parsedData.length === 0) return;

            // 통계 정보
            const countryStats = {};
            let totalSubscribers = 0;
            let subscriberCount = 0;
            let totalViews = 0;
            let viewsCount = 0;

            parsedData.forEach(item => {
                const country = item['국적'];
                if (country) {
                    countryStats[country] = (countryStats[country] || 0) + 1;
                }
                
                const subscribers = convertToNumber(item['구독자수']);
                if (subscribers > 0) {
                    totalSubscribers += subscribers;
                    subscriberCount++;
                }
                
                const views = convertToNumber(item['총조회수']);
                if (views > 0) {
                    totalViews += views;
                    viewsCount++;
                }
            });

            const avgSubscribers = subscriberCount > 0 ? Math.round(totalSubscribers / subscriberCount) : 0;
            const avgViews = viewsCount > 0 ? Math.round(totalViews / viewsCount) : 0;

            let statsHtml = `
                <div class="stats">
                    <h3>📊 통계 정보</h3>
                    <p><strong>총 유튜브 채널 수:</strong> ${parsedData.length}개</p>
                    <p><strong>평균 구독자 수:</strong> ${avgSubscribers.toLocaleString()}명</p>
                    <p><strong>평균 총 조회수:</strong> ${avgViews.toLocaleString()}회</p>
                    <p><strong>국가별 분포:</strong></p>
                    <ul>
            `;
            
            for (const [country, count] of Object.entries(countryStats)) {
                statsHtml += `<li>${country}: ${count}개</li>`;
            }
            
            statsHtml += `</ul></div>`;

            // 미리보기 테이블 (상위 10개)
            const previewData = parsedData.slice(0, 10);
            let tableHtml = `
                <h3>🏆 상위 ${Math.min(10, parsedData.length)}개 채널 미리보기</h3>
                <table class="preview-table">
                    <thead>
                        <tr>
                            <th>순번</th>
                            <th>채널명</th>
                            <th>핸들</th>
                            <th>구독자수</th>
                            <th>총조회수</th>
                            <th>동영상수</th>
                            <th>국적</th>
                            <th>인게이지먼트</th>
                            <th>협업잠재력</th>
                            <th>최근조회수</th>
                        </tr>
                    </thead>
                    <tbody>
            `;
            
            previewData.forEach(item => {
                let recentViewsHtml = '';
                if (item['최근조회수_데이터'] && item['최근조회수_데이터'].length > 0) {
                    const recentViews = item['최근조회수_데이터'].slice(0, 3); // 최대 3개만 표시
                    recentViewsHtml = recentViews.map(rv => 
                        `<div class="recent-views">${rv.조회수}${rv.날짜 ? ` (${rv.날짜})` : ''}</div>`
                    ).join('');
                }
                
                tableHtml += `
                    <tr>
                        <td>${item['순번']}</td>
                        <td>${item['채널명']}</td>
                        <td>${item['핸들']}</td>
                        <td>${item['구독자수']}</td>
                        <td>${item['총조회수']}</td>
                        <td>${item['동영상수']}</td>
                        <td>${item['국적']}</td>
                        <td>${item['인게이지먼트비율']}</td>
                        <td>${item['협업잠재력']}</td>
                        <td>${recentViewsHtml}</td>
                    </tr>
                `;
            });
            
            tableHtml += '</tbody></table>';

            document.getElementById('results').innerHTML = statsHtml + tableHtml;
        }

        function downloadExcel() {
            if (parsedData.length === 0) {
                alert('파싱된 데이터가 없습니다!');
                return;
            }

            // 엑셀용 데이터 준비 (최근조회수 데이터를 문자열로 변환)
            const excelData = parsedData.map(item => {
                const excelItem = {...item};
                
                // 최근조회수 데이터를 문자열로 변환
                if (excelItem['최근조회수_데이터'] && excelItem['최근조회수_데이터'].length > 0) {
                    excelItem['최근조회수_목록'] = excelItem['최근조회수_데이터']
                        .map(rv => `${rv.조회수}${rv.날짜 ? ` (${rv.날짜})` : ''}`)
                        .join('; ');
                } else {
                    excelItem['최근조회수_목록'] = '';
                }
                
                // 원본 배열 데이터 제거
                delete excelItem['최근조회수_데이터'];
                
                return excelItem;
            });

            const ws = XLSX.utils.json_to_sheet(excelData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, '유튜브_인플루언서_데이터');

            const now = new Date();
            const timestamp = now.getFullYear() + 
                            String(now.getMonth() + 1).padStart(2, '0') + 
                            String(now.getDate()).padStart(2, '0') + '_' +
                            String(now.getHours()).padStart(2, '0') + 
                            String(now.getMinutes()).padStart(2, '0');

            XLSX.writeFile(wb, `유튜브_인플루언서_데이터_${timestamp}.xlsx`);
        }

        function clearData() {
            document.getElementById('rawData').value = '';
            document.getElementById('results').innerHTML = '';
            parsedData = [];
            document.getElementById('downloadBtn').disabled = true;
        }

        // 페이지 로드시 샘플 데이터 표시
        window.onload = function() {

                "샘플 데이터를 확인하고 싶으시면 개발자에게 문의하세요.";
        };
    </script>
