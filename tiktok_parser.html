<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>틱톡 인플루언서 데이터 파서</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(135deg, #000000 0%, #ee1d52 50%, #69c9d0 100%);
            min-height: 100vh;
        }
        .container {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 2.5em;
        }
        .tiktok-icon {
            background: linear-gradient(135deg, #ee1d52, #69c9d0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .input-section {
            margin-bottom: 30px;
        }
        textarea {
            width: 100%;
            height: 400px;
            border: 2px solid #ddd;
            border-radius: 10px;
            padding: 15px;
            font-size: 14px;
            font-family: monospace;
            resize: vertical;
            transition: border-color 0.3s;
        }
        textarea:focus {
            border-color: #ee1d52;
            outline: none;
        }
        .button-group {
            text-align: center;
            margin: 30px 0;
        }
        button {
            background: linear-gradient(135deg, #ee1d52 0%, #69c9d0 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            margin: 0 10px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        .results-section {
            margin-top: 30px;
        }
        .stats {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
        }
        .stats h3 {
            margin-top: 0;
            color: #333;
        }
        .preview-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            font-size: 12px;
        }
        .preview-table th,
        .preview-table td {
            border: 1px solid #ddd;
            padding: 6px;
            text-align: left;
        }
        .preview-table th {
            background-color: #f2f2f2;
            font-weight: bold;
            font-size: 11px;
        }
        .preview-table tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        .status {
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
        }
        .status.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .status.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .loading {
            text-align: center;
            padding: 20px;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #ee1d52;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .recent-views {
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            border-radius: 5px;
            padding: 5px;
            margin: 3px 0;
            font-size: 10px;
        }
        .ad-tag {
            background: #ff4757;
            color: white;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 10px;
            font-weight: bold;
            margin-left: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1><span class="tiktok-icon">🎵</span> 틱톡 인플루언서 데이터 파서</h1>
        
        <div class="input-section">
            <h3>📋 NOX 틱톡 인플루언서 데이터를 아래에 붙여넣으세요:</h3>
            <textarea 
                id="rawData" 
                placeholder="여기에 NOX에서 복사한 틱톡 인플루언서 데이터를 붙여넣으세요..."></textarea>
        </div>

        <div class="button-group">
            <button onclick="parseData()" id="parseBtn">🚀 데이터 파싱하기</button>
            <button onclick="downloadExcel()" id="downloadBtn" disabled>📊 엑셀 다운로드</button>
            <button onclick="clearData()">🗑️ 초기화</button>
        </div>

        <div id="loading" class="loading" style="display: none;">
            <div class="spinner"></div>
            <p>데이터를 파싱하는 중입니다...</p>
        </div>

        <div id="results" class="results-section"></div>
    </div>

    <script>
        let parsedData = [];

        function parseTikTokData(rawText) {
            const blocks = rawText.split(/\n(?=\d+\.\d+\n)/);
            const tiktokers = [];
            
            blocks.forEach(block => {
                if (block.trim().length < 50) return;
                
                const lines = block.split('\n').map(line => line.trim()).filter(line => line);
                if (lines.length < 5) return;
                
                const tiktoker = {
                    '순번': tiktokers.length + 1,
                    '점수': '',
                    '이름': '',
                    '틱톡계정': '',
                    '태그': '',
                    '팔로워수': '',
                    '좋아요수': '',
                    '동영상수': '',
                    '국적': '',
                    '협업잠재력': '',
                    '조회수팔로워비율': '',
                    '인게이지먼트비율': '',
                    '예상조회수': '',
                    '최근조회수_데이터': []
                };
                
                let foundNumbers = false;
                let foundFirstPercent = false;
                let collectingViewsData = false;
                let previousLine = '';
                
                lines.forEach((line, i) => {
                    // 점수 (첫 번째 라인, 숫자.숫자 형태)
                    if (i === 0 && /^\d+\.\d+$/.test(line)) {
                        tiktoker['점수'] = line;
                    }
                    // 이름 (점수 바로 다음, @ 시작 아님)
                    else if (i === 1 && !line.startsWith('@')) {
                        tiktoker['이름'] = line;
                    }
                    // 틱톡 계정 (@ 시작)
                    else if (line.startsWith('@')) {
                        tiktoker['틱톡계정'] = line;
                    }
                    // 태그 (계정 바로 다음, 영문 소문자 또는 한글/중국어 포함)
                    else if (i > 0 && lines[i-1].startsWith('@')) {
                        tiktoker['태그'] = line;
                    }
                    // 팔로워/좋아요/동영상수 (K, M 포함 3개 숫자)
                    else if (!foundNumbers) {
                        const numberMatch = line.match(/^\s*(\d+\.?\d*[KM]?)\s+(\d+\.?\d*[KM]?)\s+(\d+\.?\d*[KM]?)\s*$/);
                        if (numberMatch) {
                            tiktoker['팔로워수'] = numberMatch[1];
                            tiktoker['좋아요수'] = numberMatch[2];
                            tiktoker['동영상수'] = numberMatch[3];
                            foundNumbers = true;
                        }
                    }
                    // 국적
                    else if (['Taiwan', 'South Korea', 'Hong Kong SAR China', 'Macau SAR China', 
                              'United States', 'Japan', 'China', 'Thailand', 'Vietnam', 
                              'Singapore', 'Malaysia', 'Indonesia', 'Philippines'].includes(line)) {
                        tiktoker['국적'] = line.replace(' SAR China', '');
                    }
                    // 협업잠재력 (숫자/10 형태)
                    else if (line.includes('/10')) {
                        const coopMatch = line.match(/(\d+)\s*\/\s*10/);
                        if (coopMatch) {
                            tiktoker['협업잠재력'] = `${coopMatch[1]}/10`;
                        }
                    }
                    // Views/Subs 비율 찾기
                    else if (line.includes('Views/Subs')) {
                        collectingViewsData = false;
                    }
                    // 퍼센트 값들
                    else if (line.includes('%')) {
                        if (!foundFirstPercent) {
                            tiktoker['조회수팔로워비율'] = line;
                            foundFirstPercent = true;
                        } else if (!tiktoker['인게이지먼트비율']) {
                            tiktoker['인게이지먼트비율'] = line;
                        }
                    }
                    // 예상조회수 (K, M 포함하고 앞 라인에 Views 있음)
                    else if ((line.includes('K') || line.includes('M')) && 
                            i > 0 && lines[i-1].includes('Views')) {
                        tiktoker['예상조회수'] = line;
                        collectingViewsData = true;
                    }
                    // 날짜별 조회수 데이터 처리
                    else if (/\d{4}-\d{2}-\d{2}/.test(line)) {
                        // AD 태그 확인
                        const isAd = i + 1 < lines.length && lines[i + 1] === 'AD';
                        
                        if (i > 0 && /^\d+\.?\d*[KM]?$/.test(lines[i-1])) {
                            tiktoker['최근조회수_데이터'].push({
                                조회수: lines[i-1],
                                날짜: line,
                                광고: isAd
                            });
                        }
                    }
                    // AD 태그 (이미 날짜와 함께 처리됨)
                    else if (line === 'AD') {
                        // 이미 위에서 처리함
                    }
                    // 단독 조회수 데이터
                    else if (collectingViewsData && /^\d+\.?\d*[KM]?$/.test(line) && 
                            !tiktoker['예상조회수'].includes(line)) {
                        if (i + 1 < lines.length && /\d{4}-\d{2}-\d{2}/.test(lines[i + 1])) {
                            // 다음 라인에 날짜가 있으면 다음 루프에서 처리
                        } else {
                            tiktoker['최근조회수_데이터'].push({
                                조회수: line,
                                날짜: '',
                                광고: false
                            });
                        }
                    }
                    
                    previousLine = line;
                });
                
                // 최소 조건: 이름이나 계정이 있어야 함
                if (tiktoker['이름'] || tiktoker['틱톡계정']) {
                    tiktokers.push(tiktoker);
                }
            });
            
            return tiktokers;
        }

        function convertToNumber(value) {
            if (!value) return 0;
            value = String(value).replace(',', '');
            if (value.includes('K')) {
                return parseFloat(value.replace('K', '')) * 1000;
            } else if (value.includes('M')) {
                return parseFloat(value.replace('M', '')) * 1000000;
            } else {
                try {
                    return parseFloat(value);
                } catch {
                    return 0;
                }
            }
        }

        function parseData() {
            const rawData = document.getElementById('rawData').value.trim();
            if (!rawData) {
                alert('데이터를 입력해주세요!');
                return;
            }

            document.getElementById('loading').style.display = 'block';
            document.getElementById('results').innerHTML = '';
            document.getElementById('parseBtn').disabled = true;

            setTimeout(() => {
                try {
                    parsedData = parseTikTokData(rawData);
                    
                    // 팔로워 수 기준으로 정렬
                    parsedData.sort((a, b) => convertToNumber(b['팔로워수']) - convertToNumber(a['팔로워수']));
                    
                    // 순번 재정렬
                    parsedData.forEach((item, index) => {
                        item['순번'] = index + 1;
                    });

                    displayResults();
                    document.getElementById('downloadBtn').disabled = false;
                    
                    document.getElementById('results').innerHTML += 
                        `<div class="status success">✅ ${parsedData.length}명의 틱톡 인플루언서 데이터가 성공적으로 파싱되었습니다!</div>`;
                        
                } catch (error) {
                    document.getElementById('results').innerHTML = 
                        `<div class="status error">❌ 파싱 중 오류가 발생했습니다: ${error.message}</div>`;
                } finally {
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('parseBtn').disabled = false;
                }
            }, 500);
        }

        function displayResults() {
            if (parsedData.length === 0) return;

            // 통계 정보
            const countryStats = {};
            let totalFollowers = 0;
            let followerCount = 0;
            let totalLikes = 0;
            let likesCount = 0;
            let adCount = 0;

            parsedData.forEach(item => {
                const country = item['국적'];
                if (country) {
                    countryStats[country] = (countryStats[country] || 0) + 1;
                }
                
                const followers = convertToNumber(item['팔로워수']);
                if (followers > 0) {
                    totalFollowers += followers;
                    followerCount++;
                }
                
                const likes = convertToNumber(item['좋아요수']);
                if (likes > 0) {
                    totalLikes += likes;
                    likesCount++;
                }
                
                // AD 카운트
                if (item['최근조회수_데이터']) {
                    item['최근조회수_데이터'].forEach(view => {
                        if (view.광고) adCount++;
                    });
                }
            });

            const avgFollowers = followerCount > 0 ? Math.round(totalFollowers / followerCount) : 0;
            const avgLikes = likesCount > 0 ? Math.round(totalLikes / likesCount) : 0;

            let statsHtml = `
                <div class="stats">
                    <h3>📊 통계 정보</h3>
                    <p><strong>총 틱톡 계정 수:</strong> ${parsedData.length}개</p>
                    <p><strong>평균 팔로워 수:</strong> ${avgFollowers.toLocaleString()}명</p>
                    <p><strong>평균 좋아요 수:</strong> ${avgLikes.toLocaleString()}개</p>
                    <p><strong>광고 게시물 수:</strong> ${adCount}개</p>
                    <p><strong>국가별 분포:</strong></p>
                    <ul>
            `;
            
            for (const [country, count] of Object.entries(countryStats)) {
                statsHtml += `<li>${country}: ${count}명</li>`;
            }
            
            statsHtml += `</ul></div>`;

            // 미리보기 테이블 (상위 10개)
            const previewData = parsedData.slice(0, 10);
            let tableHtml = `
                <h3>🏆 상위 ${Math.min(10, parsedData.length)}명 미리보기</h3>
                <table class="preview-table">
                    <thead>
                        <tr>
                            <th>순번</th>
                            <th>이름</th>
                            <th>틱톡계정</th>
                            <th>팔로워수</th>
                            <th>좋아요수</th>
                            <th>동영상수</th>
                            <th>국적</th>
                            <th>인게이지먼트</th>
                            <th>협업잠재력</th>
                            <th>최근조회수</th>
                        </tr>
                    </thead>
                    <tbody>
            `;
            
            previewData.forEach(item => {
                let recentViewsHtml = '';
                if (item['최근조회수_데이터'] && item['최근조회수_데이터'].length > 0) {
                    const recentViews = item['최근조회수_데이터'].slice(0, 3);
                    recentViewsHtml = recentViews.map(rv => {
                        const adTag = rv.광고 ? '<span class="ad-tag">AD</span>' : '';
                        return `<div class="recent-views">${rv.조회수}${rv.날짜 ? ` (${rv.날짜})` : ''}${adTag}</div>`;
                    }).join('');
                }
                
                tableHtml += `
                    <tr>
                        <td>${item['순번']}</td>
                        <td>${item['이름']}</td>
                        <td>${item['틱톡계정']}</td>
                        <td>${item['팔로워수']}</td>
                        <td>${item['좋아요수']}</td>
                        <td>${item['동영상수']}</td>
                        <td>${item['국적']}</td>
                        <td>${item['인게이지먼트비율']}</td>
                        <td>${item['협업잠재력']}</td>
                        <td>${recentViewsHtml}</td>
                    </tr>
                `;
            });
            
            tableHtml += '</tbody></table>';

            document.getElementById('results').innerHTML = statsHtml + tableHtml;
        }

        function downloadExcel() {
            if (parsedData.length === 0) {
                alert('파싱된 데이터가 없습니다!');
                return;
            }

            // 엑셀용 데이터 준비
            const excelData = parsedData.map(item => {
                const excelItem = {...item};
                
                // 최근조회수 데이터를 문자열로 변환
                if (excelItem['최근조회수_데이터'] && excelItem['최근조회수_데이터'].length > 0) {
                    excelItem['최근조회수_목록'] = excelItem['최근조회수_데이터']
                        .map(rv => {
                            const adTag = rv.광고 ? ' [AD]' : '';
                            return `${rv.조회수}${rv.날짜 ? ` (${rv.날짜})` : ''}${adTag}`;
                        })
                        .join('; ');
                    
                    // 광고 게시물 수 계산
                    excelItem['광고게시물수'] = excelItem['최근조회수_데이터'].filter(rv => rv.광고).length;
                } else {
                    excelItem['최근조회수_목록'] = '';
                    excelItem['광고게시물수'] = 0;
                }
                
                // 원본 배열 데이터 제거
                delete excelItem['최근조회수_데이터'];
                
                return excelItem;
            });

            const ws = XLSX.utils.json_to_sheet(excelData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, '틱톡_인플루언서_데이터');

            const now = new Date();
            const timestamp = now.getFullYear() + 
                            String(now.getMonth() + 1).padStart(2, '0') + 
                            String(now.getDate()).padStart(2, '0') + '_' +
                            String(now.getHours()).padStart(2, '0') + 
                            String(now.getMinutes()).padStart(2, '0');

            XLSX.writeFile(wb, `틱톡_인플루언서_데이터_${timestamp}.xlsx`);
        }

        function clearData() {
            document.getElementById('rawData').value = '';
            document.getElementById('results').innerHTML = '';
            parsedData = [];
            document.getElementById('downloadBtn').disabled = true;
        }

        // 페이지 로드시 샘플 데이터
        window.onload = function() {
            const sampleData = `2.95

            document.getElementById('rawData').placeholder = 
                "여기에 NOX에서 복사한 틱톡 인플루언서 데이터를 붙여넣으세요...\n\n" + 
                "광고 게시물(AD)도 자동으로 인식됩니다.";
        };
    </script>
